[workspace]

[package]
name = "ollama-litert-lm-rs"
version = "0.1.0"
edition = "2021"
description = "Ollama & OpenAI compatible multimodal LLM server (LiteRT-LM + llama.cpp GGUF) in Rust"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
chrono = "0.4"
rand = "0.8"
libc = "0.2"
bytes = "1"
futures-util = "0.3"
anyhow = "1"

[build-dependencies]
cc = "1"
